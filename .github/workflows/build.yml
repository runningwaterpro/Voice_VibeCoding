name: build-nsis

on:
  push:
    branches: [main, "fix/*"]
    tags: ["v*"]
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install frontend deps
        run: npm ci

      - name: Build NSIS installer (no MSI)
        run: npx tauri build

      - name: Upload NSIS installer
        uses: actions/upload-artifact@v4
        with:
          name: Voice-VibeCoding-NSIS
          path: src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: error

      # 上传到 Release：push tag v* 或 release published 都触发。
      # 用户手动发布 Release 时，GitHub 会创建/指向对应 tag → 自动编译并附带安装包。
      - name: Create Release and upload installer
        if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'release'
        uses: softprops/action-gh-release@v2
        with:
          files: src-tauri/target/release/bundle/nsis/*.exe
          generate_release_notes: false